{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{note.title}}{% endblock title %}

{% block content %}
    <div class="card-body bg-light text-dark p-3">
        <form action="" method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a><a href="{% url 'note-detail' note.pk %}" class="btn btn-danger">Back</a>
        </form>
    </div>
{% endblock content %}
