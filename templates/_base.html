<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home Page{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'styles/icons.css' %}">
    <link rel="stylesheet" href="{% static 'styles/notes-detail.css' %}">
    <link rel="stylesheet" href="{% static 'styles/header.css' %}">
</head>
<body>
    <header class="p-1 bg-dark text-white custom-header">
        <div class="container-fluid d-flex align-items-center justify-content-between header-content">
            <div class="d-flex align-items-center app-name">
                <h1 class="m-0">
                <a href="{% url 'home' %}" class="text-white text-decoration-none fw-bold fs-1">Notes</a>
                </h1>
            </div>
            <div class="d-flex align-items-center mx-1 w-50 search-bar">
                <form class="d-flex" action="{% url 'search-results' %}" method="get">
                    <input type="text" class="form-control me-2" placeholder="Search" aria-label="Search" name="q">
                    <button class="btn btn-outline-success" type="submit"><i class="icon-search"></i>Search</button>
                </form>
            </div>
            <div class="ms-auto d-flex align-items-center justify-content-end">
                {% if user.is_authenticated %}
                <p class="m-0 d-inline mx-2">Hello, {{ user.username }}</p>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary">Logout</button>
                </form>
                <a><a href="{% url 'note-create' %}" class="btn btn-primary mx-2">Create Note</a>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-primary">Login</a> 
                <a href="{% url 'signup' %}" class="btn btn-primary mx-2">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </header>

    <div>
    {% block content %}

    {% endblock content %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
