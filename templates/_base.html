<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home Page{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'styles/icons.css' %}">
    <link rel="stylesheet" href="{% static 'styles/notes-detail.css' %}">
    <link rel="stylesheet" href="{% static 'styles/header.css' %}">
</head>
<body>
    <header class="custom-header">
        <div class="container-fluid d-flex align-items-center justify-content-between header-content">
            <div class="d-flex align-items-center app-name">
                <h1 class="m-0">
                <a href="{% url 'home' %}" class="text-white text-decoration-none fw-bold fs-1">NOTES</a>
                </h1>
            </div>
            <div class="d-flex align-items-center justify-content-end mx-1  search-bar">
                <form class="d-flex" action="{% url 'search-results' %}" method="get">
                    <input type="text" class="form-control me-2" placeholder="Search" aria-label="Search" name="q">
                    <button class="btn btn-outline-secondary btn-sm" type="submit"><i class="icon-search"></i>Search</button>
                </form>
            </div>
            <div class="ms-auto d-flex align-items-center justify-content-end">
                {% if user.is_authenticated %}
                <div class="dropdown">
                    <!-- Username always visible, acts as dropdown toggle -->
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Hello, {{ user.username }}
                    </button>

                    <!-- Dropdown menu -->
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="{% url 'note-create' %}">Create Note</a>
                        </li>
                        <li>
                            <a href="{% url 'swagger-ui' %}" class="dropdown-item">API Docs</a>
                        </li>
                        <li>
                            <a href="{% url 'account_change_password' %}" class="dropdown-item">Change Password</a>
                        </li>
                        <li>
                            <form action="{% url 'account_logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-danger">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
                {% else %}
                <a href="{% url 'account_login' %}" class="btn btn-primary">Login</a>
                <a href="{% url 'account_signup' %}" class="btn btn-primary mx-2">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </header>

    <div>
    {% block content %}

    {% endblock content %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
