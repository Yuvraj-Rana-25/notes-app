{% load crispy_forms_tags %}

{% block content %}

        <form action="" method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
{% endblock content %}
