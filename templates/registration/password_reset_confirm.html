{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% block title %}Enter new password{% endblock title %}

{% block content %}
    <div class="card-body bg-light text-dark p-3">
        <h5 class="card-title">Enter new password</h5>
        <form action="" method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
{% endblock content %}
