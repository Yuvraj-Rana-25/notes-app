{% extends '_base.html' %}

{% block content %}
    {% for note in notes %}
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Title : {{ note.title }}</h5>
                <p class="card-text">Author: {{ note.content }}</p>
                <p class="card-text">Created at: {{ note.created_at }}</p>
            </div>
        </div>
    {% endfor %}
{% endblock content %}
