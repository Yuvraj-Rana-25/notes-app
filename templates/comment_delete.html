{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% block title %}Delete Comment{% endblock title %}

{% block content %}
    <div class="card-body bg-light text-dark p-3">
        <form action="" method="post">
            {% csrf_token %}
            <p>Are you sure you want to delete "{{ comment.content }}"?</p>
            <button type="submit" class="btn btn-danger btn-sm d-inline">Delete</button>
            <a href="{% url 'note-detail' note.pk %}" class="btn btn-primary d-inline btn-sm">Back</a>
        </form>
    </div>
{% endblock content %}
